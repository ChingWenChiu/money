<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFBCA6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="財務規劃" />
  <title>財務規劃</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #fff8f5;
      color: #2a1a14;
      overflow: hidden;
    }

    /* ── App Shell ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: #fff8f5;
    }

    /* ── Scrollable Content Area ── */
    #content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: env(safe-area-inset-top, 44px) 16px 16px;
    }

    /* ── Bottom Nav ── */
    #nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
      background: #fff8f5;
      border-top: 0.5px solid rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 16px;
      border: none;
      background: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item svg { display: block; }
    .nav-label {
      font-size: 10px;
      font-weight: 500;
      color: #d4b0a4;
    }
    .nav-item.active .nav-label { color: #c4614a; }

    /* ── Page Header ── */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .page-title { font-size: 26px; font-weight: 700; color: #2a1a14; }
    .page-sub { font-size: 12px; color: #c4a89a; margin-top: 2px; }
    .edit-btn {
      width: 32px; height: 32px;
      background: #ffe8e0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    /* ── Hero Card ── */
    .hero-card {
      background: #FFBCA6;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .hero-label { font-size: 11px; color: rgba(80,30,15,0.6); margin-bottom: 3px; }
    .hero-amount { font-size: 32px; font-weight: 700; color: #3d1a0a; letter-spacing: -1px; }
    .hero-sub { font-size: 11px; color: rgba(80,30,15,0.5); margin-top: 3px; }
    .hero-track {
      background: rgba(255,255,255,0.35);
      border-radius: 5px; height: 6px;
      margin-top: 12px; overflow: hidden;
    }
    .hero-fill { height: 100%; border-radius: 5px; background: #fff0ea; transition: width 0.5s ease; }
    .hero-footer {
      display: flex; justify-content: space-between;
      margin-top: 6px; font-size: 10px;
      color: rgba(80,30,15,0.55);
    }

    /* ── Section Label ── */
    .sec-label {
      font-size: 11px; font-weight: 600;
      color: #c4a89a; letter-spacing: 0.06em;
      margin-bottom: 8px; margin-top: 4px;
    }

    /* ── Asset Grid (Page 1) ── */
    .asset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .asset-item { cursor: pointer; }
    .asset-item:active { opacity: 0.7; }
    .asset-item {
      background: #fff;
      border-radius: 14px;
      padding: 11px 13px;
      border: 0.5px solid rgba(0,0,0,0.05);
    }
    .asset-item.full { grid-column: span 2; }
    .asset-name { font-size: 11px; color: #c4a89a; margin-bottom: 4px; }
    .asset-val { font-size: 17px; font-weight: 700; color: #2a1a14; }
    .asset-val.accent { color: #c4614a; }
    .asset-val.warn { color: #c48a3a; }
    .asset-val.neg { color: #d05a3a; }
    .asset-sub { font-size: 10px; color: #d4b8ae; margin-top: 2px; }

    /* ── Drag & Drop ── */
    .asset-item.dragging { opacity: 0.25; }
    .drag-placeholder {
      border-radius: 14px;
      border: 2px dashed #FFBCA6;
      background: #fff0eb;
    }

    /* ── Add Item Button ── */
    .add-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed #e8c8be !important;
      background: transparent !important;
      gap: 2px;
    }
    .add-item-btn .add-icon { font-size: 20px; color: #d4b0a4; line-height: 1; }
    .add-item-btn .asset-name { margin: 0; }

    /* ── Type Toggle ── */
    .type-toggle { display: flex; gap: 8px; }
    .type-toggle button {
      flex: 1; padding: 8px 0; border-radius: 10px;
      border: 1.5px solid #e8c8be; background: #fff;
      font-size: 14px; color: #c4a89a; cursor: pointer;
    }
    .type-toggle button.active {
      background: #FFBCA6; border-color: #FFBCA6; color: #2a1a14; font-weight: 600;
    }

    /* ── Exclude Row ── */
    .exclude-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #c4a89a; margin-bottom: 14px; cursor: pointer;
    }
    .exclude-row input { width: 16px; height: 16px; accent-color: #c4614a; cursor: pointer; }
    .asset-item.excluded { opacity: 0.45; }

    /* ── Delete Button ── */
    .delete-btn { color: #d05a3a !important; }

    /* ── Settings Page ── */
    .settings-section { margin-bottom: 24px; }
    .settings-label { font-size: 11px; color: #c4a89a; font-weight: 600; margin-bottom: 8px; padding: 0 2px; }
    .settings-card { background: #fff; border-radius: 16px; border: 0.5px solid rgba(0,0,0,0.05); overflow: hidden; }
    .settings-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border-bottom: 0.5px solid rgba(0,0,0,0.05);
      cursor: pointer;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row:active { background: #fdf0ec; }
    .settings-icon {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .settings-text { flex: 1; }
    .settings-title { font-size: 15px; font-weight: 500; color: #2a1a14; }
    .settings-sub { font-size: 12px; color: #c4a89a; margin-top: 1px; }
    .settings-arrow { color: #d4b0a4; font-size: 14px; }
    .settings-row.danger .settings-title { color: #d05a3a; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      border: 0.5px solid rgba(0,0,0,0.05);
      margin-bottom: 12px;
    }

    /* ── Entry Row ── */
    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 0.5px solid rgba(0,0,0,0.05);
    }
    .entry-row:last-child { border-bottom: none; }
    .entry-left { display: flex; align-items: flex-start; gap: 9px; }
    .entry-dot {
      width: 8px; height: 8px;
      border-radius: 50%; flex-shrink: 0;
      margin-top: 3px;
    }
    .entry-name { font-size: 13px; font-weight: 500; color: #2a1a14; }
    .entry-sub { font-size: 10px; color: #c4a89a; }
    .entry-note {
      display: inline-flex; align-items: center; gap: 4px;
      background: #fff8f0; border-radius: 6px;
      padding: 3px 7px; margin-top: 4px;
      font-size: 10px; color: #c48a3a;
    }
    .entry-note-dot { width: 5px; height: 5px; border-radius: 50%; background: #FFBCA6; flex-shrink: 0; }
    .entry-right { text-align: right; }
    .entry-amount { font-size: 14px; font-weight: 700; }
    .entry-amount.pos { color: #4a9e72; }
    .entry-amount.neg { color: #d05a3a; }
    .entry-amount.accent { color: #c4614a; }
    .entry-detail { font-size: 10px; color: #c4a89a; }

    /* ── Add Button ── */
    .add-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 7px;
      background: #ffe8e0;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      border: none; cursor: pointer;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .add-btn span { font-size: 13px; font-weight: 600; color: #c4614a; }
    .add-circle {
      width: 18px; height: 18px;
      background: #FFBCA6;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #7a2a18; font-size: 16px; font-weight: 700; line-height: 1;
    }

    /* ── Year Tabs ── */
    .tab-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab-btn {
      padding: 5px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      background: #f5ede8; color: #c4a89a;
      border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { background: #FFBCA6; color: #7a2a18; }

    /* ── Mini Bar Chart ── */
    .mini-bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 56px;
      margin-bottom: 6px;
    }
    .mini-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      height: 100%;
      justify-content: flex-end;
    }
    .mini-bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      min-height: 3px;
    }
    .mini-bar-lbl { font-size: 8px; color: #c4a89a; }

    /* ── ETF Hero ── */
    .etf-hero {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .etf-main { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
    .etf-lbl { font-size: 11px; color: #c4a89a; margin-bottom: 6px; }
    .etf-big { font-size: 30px; font-weight: 700; color: #2a1a14; letter-spacing: -1px; }
    .etf-ret { font-size: 15px; font-weight: 700; color: #d05a3a; }
    .etf-cost-row { display: flex; gap: 20px; margin-top: 8px; }
    .etf-cost-lbl { font-size: 10px; color: #c4a89a; margin-bottom: 2px; }
    .etf-cost-val { font-size: 13px; font-weight: 600; color: #6a3a2a; }
    .etf-gain-val { font-size: 13px; font-weight: 700; color: #d05a3a; }
    .seg-bar {
      height: 8px; border-radius: 6px;
      display: flex; gap: 3px;
      margin-top: 12px; overflow: hidden;
    }
    .seg-tw { flex: 65.41; background: #6baed6; }
    .seg-os { flex: 34.59; background: #74c69d; }
    .seg-labels { display: flex; gap: 14px; margin-top: 6px; }
    .seg-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #6a3a2a; font-weight: 500; }
    .seg-sq { width: 9px; height: 9px; border-radius: 2px; }

    /* ── Goal Items (Page 4) ── */
    .goal-item {
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      border: 0.5px solid rgba(0,0,0,0.05);
      margin-bottom: 9px;
    }
    .goal-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .goal-name { font-size: 13px; font-weight: 600; color: #2a1a14; }
    .goal-pct { font-size: 11px; font-weight: 700; color: #c4614a; }
    .goal-pct.done { color: #4a9e72; }
    .goal-track { background: #f5ede8; border-radius: 5px; height: 7px; overflow: hidden; }
    .goal-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
    .goal-detail { font-size: 10px; color: #c4a89a; margin-top: 5px; }

    /* ── Modal Overlay ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(40,20,10,0.45);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: #fff8f5;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      touch-action: pan-y;
      will-change: transform;
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: #d4b0a4; border-radius: 2px;
      margin: 0 auto 16px;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: #2a1a14; margin-bottom: 16px; }

    /* ── Form Fields ── */
    .field { margin-bottom: 14px; }
    .field label { font-size: 11px; color: #c4a89a; font-weight: 600; display: block; margin-bottom: 5px; }
    .field input, .field textarea, .field select {
      width: 100%;
      background: #f5ede8;
      border: 0.5px solid rgba(0,0,0,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: #2a1a14;
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: #FFBCA6;
    }
    .field textarea { resize: none; height: 72px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .submit-btn {
      width: 100%;
      background: #FFBCA6;
      color: #7a2a18;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px;
    }
    .cancel-btn {
      width: 100%;
      background: #f5ede8;
      color: #c4a89a;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-item active" onclick="showPage(0)" id="nav0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="12" width="7" height="9" rx="1.5" fill="#c4614a"/>
        <rect x="13" y="5" width="8" height="16" rx="1.5" fill="#c4614a" opacity="0.45"/>
      </svg>
      <span class="nav-label">總覽</span>
    </button>
    <button class="nav-item" onclick="showPage(1)" id="nav1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="8" stroke="#d4b0a4" stroke-width="1.6"/>
        <path d="M12 7v5l3.5 2" stroke="#d4b0a4" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">記帳</span>
    </button>
    <button class="nav-item" onclick="showPage(2)" id="nav2">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 17l5-6 5 4 6-8" stroke="#d4b0a4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">投資</span>
    </button>
    <button class="nav-item" onclick="showPage(3)" id="nav3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 15.5l-5 2.7 1-5.5L4 8.8 9.5 8z" stroke="#d4b0a4" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">目標</span>
    </button>
    <button class="nav-item" onclick="showPage(4)" id="nav4">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="3.5" stroke="#d4b0a4" stroke-width="1.6"/>
        <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="#d4b0a4" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">設定</span>
    </button>
  </nav>
</div>

<!-- ── Modal: 新增月份記帳 ── -->
<div class="modal-overlay" id="modal-ledger">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="ledger-modal-title">新增月份記錄</div>
    <div class="field-row">
      <div class="field">
        <label>年份</label>
        <select id="ledger-year"></select>
      </div>
      <div class="field">
        <label>月份</label>
        <select id="ledger-month">
          <option>1月</option><option>2月</option><option>3月</option>
          <option>4月</option><option>5月</option><option>6月</option>
          <option>7月</option><option>8月</option><option>9月</option>
          <option>10月</option><option>11月</option><option>12月</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>收入 (TWD)</label><input type="number" id="ledger-income" placeholder="0" /></div>
      <div class="field"><label>支出 (TWD)</label><input type="number" id="ledger-expense" placeholder="0" /></div>
    </div>
    <div class="field">
      <label>備註（可選）</label>
      <textarea id="ledger-note" placeholder="例如：出國玩、紅包、健檢…"></textarea>
    </div>
    <button class="submit-btn" onclick="saveLedger()">儲存</button>
    <button class="cancel-btn delete-btn" id="ledger-delete-btn" onclick="deleteLedger()">刪除此筆記錄</button>
    <button class="cancel-btn" onclick="closeModal('modal-ledger')">取消</button>
  </div>
</div>

<!-- ── Modal: 新增 ETF 投資 ── -->
<div class="modal-overlay" id="modal-etf">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">新增投資筆數</div>
    <div class="field-row">
      <div class="field">
        <label>日期</label>
        <input type="date" id="etf-date" />
      </div>
      <div class="field">
        <label>ETF 名稱</label>
        <input type="text" id="etf-name" placeholder="例如 QQQ" />
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>投資金額 (TWD)</label><input type="number" id="etf-amount" placeholder="0" /></div>
      <div class="field"><label>成交價</label><input type="number" id="etf-price" placeholder="0.00" step="0.01" /></div>
    </div>
    <div class="field">
      <label>備註（可選）</label>
      <input type="text" id="etf-note" placeholder="可選" />
    </div>
    <button class="submit-btn" onclick="saveEtf()">儲存</button>
    <button class="cancel-btn" onclick="closeModal('modal-etf')">取消</button>
  </div>
</div>

<!-- ── Modal: 編輯／新增帳戶 ── -->
<div class="modal-overlay" id="modal-account">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-account-title">編輯帳戶</div>
    <div class="field">
      <label>名稱</label>
      <input type="text" id="acc-name" placeholder="例：台新銀行" />
    </div>
    <div class="field">
      <label>金額</label>
      <input type="number" id="acc-value" placeholder="0" />
    </div>
    <div class="field">
      <label>類型</label>
      <div class="type-toggle">
        <button id="type-asset-btn" onclick="setAccType('asset')">資產</button>
        <button id="type-debt-btn" onclick="setAccType('debt')">負債</button>
      </div>
    </div>
    <label class="exclude-row">
      <input type="checkbox" id="acc-exclude" />
      <span>不計入總額</span>
    </label>
    <button class="submit-btn" onclick="saveAccount()">儲存</button>
    <button class="cancel-btn delete-btn" id="acc-delete-btn" onclick="deleteAccount()">刪除此項目</button>
    <button class="cancel-btn" onclick="closeModal('modal-account')">取消</button>
  </div>
</div>

<!-- ── Modal: ETF 市值快照 ── -->
<div class="modal-overlay" id="modal-etf-snapshot">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">更新庫存總現值</div>
    <div class="field"><label>庫存總現值 (TWD)</label><input type="number" id="etf-snap-value" /></div>
    <button class="submit-btn" onclick="saveEtfSnapshot()">儲存</button>
    <button class="cancel-btn" onclick="closeModal('modal-etf-snapshot')">取消</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  DATA STORE  (localStorage)
// ═══════════════════════════════════════
const KEYS = {

// 修復重複 ID（舊資料問題）
function fixDuplicateIds(list) {
  const seen = new Set();
  return list.map(a => {
    if (seen.has(a.id)) return { ...a, id: genId() };
    seen.add(a.id);
    return a;
  });
}

// 從舊 fp_assets 格式自動搬移
function loadAccounts() {
  if (localStorage.getItem(KEYS.accounts)) {
    const stored = load(KEYS.accounts, defaultAccounts);
    const fixed = fixDuplicateIds(stored);
    // 若有修復，存回去
    if (fixed.some((a, i) => a.id !== stored[i]?.id)) save(KEYS.accounts, fixed);
    return fixed;
  }
  const old = load(KEYS.assets, null);
  if (old && old.taishin !== undefined) {
    const migrated = [
      { id: genId(), name: '台新銀行',  value: old.taishin    || 0 },
      { id: genId(), name: '國泰銀行',  value: old.cathay     || 0 },
      { id: genId(), name: '媽媽借款',  value: old.mom        || 0 },
      { id: genId(), name: '信用卡帳單', value: old.creditCard || 0 },
    ];
    save(KEYS.accounts, migrated);
    return migrated;
  }
  return defaultAccounts;
}

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('zh-TW');
const fmtSigned = n => (n >= 0 ? '+$' : '-$') + Math.abs(Math.round(n)).toLocaleString('zh-TW');

function netWorth() {
  return accounts.filter(a => !a.exclude).reduce((sum, a) => sum + a.value, 0) + assets.etfValue;
}

function ledgerByYear(year) {
  return ledger.filter(r => r.year === year).sort((a,b) => b.month - a.month);
}

function recentSixMonths() {
  const sorted = [...ledger].sort((a,b) => a.year !== b.year ? b.year - a.year : b.month - a.month);
  return sorted.slice(0, 6).reverse();
}

function etfTotals() {
  const map = {};
  etfLog.forEach(r => {
    if (!map[r.name]) map[r.name] = { amount: 0, count: 0 };
    map[r.name].amount += r.amount;
    map[r.name].count += 1;
  });
  return map;
}

function etfYearTotal(year) {
  return etfLog.filter(r => r.date.startsWith(year)).reduce((s,r) => s + r.amount, 0);
}

function etfByYear(year) {
  return etfLog.filter(r => r.date.startsWith(year)).sort((a,b) => b.date.localeCompare(a.date));
}

function etfYearBreakdown(year) {
  const map = {};
  etfByYear(year).forEach(r => {
    if (!map[r.name]) map[r.name] = 0;
    map[r.name] += r.amount;
  });
  return map;
}

function initDragSort() {
  [['asset-grid-assets', true], ['asset-grid-debts', false]].forEach(([gridId, isAsset]) => {
    const grid = document.getElementById(gridId);
    if (!grid) return;
    grid.querySelectorAll('.asset-item[data-id]').forEach(item => {
      let pressTimer = null, isDragging = false;
      let clone = null, placeholder = null;
      let startX = 0, startY = 0, offsetX = 0, offsetY = 0;

      item.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        pressTimer = setTimeout(() => {
          isDragging = true;
          const rect = item.getBoundingClientRect();
          offsetX = startX - rect.left;
          offsetY = startY - rect.top;

          clone = item.cloneNode(true);
          clone.style.cssText = `position:fixed;width:${rect.width}px;height:${rect.height}px;` +
            `left:${rect.left}px;top:${rect.top}px;opacity:0.9;pointer-events:none;z-index:999;` +
            `transform:scale(1.06);box-shadow:0 8px 24px rgba(0,0,0,0.15);border-radius:14px;`;
          document.body.appendChild(clone);

          placeholder = document.createElement('div');
          placeholder.className = 'drag-placeholder';
          placeholder.style.cssText = `width:${rect.width}px;height:${rect.height}px;`;
          item.classList.add('dragging');
          item.after(placeholder);
        }, 400);
      }, { passive: true });

      item.addEventListener('touchmove', e => {
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (!isDragging) {
          if (dx > 8 || dy > 8) clearTimeout(pressTimer);
          return;
        }
        e.preventDefault();
        const touch = e.touches[0];
        clone.style.left = (touch.clientX - offsetX) + 'px';
        clone.style.top  = (touch.clientY - offsetY) + 'px';

        // 找最近的格子，移動 placeholder
        const siblings = [...grid.querySelectorAll('.asset-item[data-id]')];
        let nearest = null, nearestDist = Infinity;
        siblings.forEach(el => {
          const r = el.getBoundingClientRect();
          const dist = Math.hypot(touch.clientX - (r.left + r.width / 2),
                                  touch.clientY - (r.top  + r.height / 2));
          if (dist < nearestDist) { nearestDist = dist; nearest = el; }
        });
        if (nearest && nearest !== item) {
          const r = nearest.getBoundingClientRect();
          const after = touch.clientX > r.left + r.width / 2;
          after ? nearest.after(placeholder) : nearest.before(placeholder);
        }
      }, { passive: false });

      const endDrag = () => {
        clearTimeout(pressTimer);
        if (!isDragging) return;
        isDragging = false;
        clone.remove(); clone = null;
        item.classList.remove('dragging');
        placeholder.replaceWith(item);

        // 讀取 DOM 新順序，更新 accounts
        const newOrder = [...grid.querySelectorAll('.asset-item[data-id]')].map(el => el.dataset.id);
        const reordered = newOrder.map(id => accounts.find(a => a.id === id)).filter(Boolean);
        const other = accounts.filter(a => isAsset ? a.value < 0 : a.value >= 0);
        accounts = isAsset ? [...reordered, ...other] : [...other, ...reordered];
        save(KEYS.accounts, accounts);
        renderPage1();
      };
      item.addEventListener('touchend', endDrag);
      item.addEventListener('touchcancel', endDrag);
    });
  });
}

    });
  });

  pages[idx]();
}

  const avgExpense = Math.round(yearExpense / months);

function exportBackup() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    accounts: accounts,
    assets:   assets,
    ledger:   ledger,
    etf:      etfLog,
    goals:    goals,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `財務備份_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  localStorage.setItem('fp_last_backup', new Date().toISOString());
  renderPage5();
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('匯入會覆蓋目前所有資料，確定繼續？')) {
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.accounts) { accounts = data.accounts; save(KEYS.accounts, accounts); }
      if (data.assets)   { assets   = data.assets;   save(KEYS.assets,   assets);   }
      if (data.ledger)   { ledger   = data.ledger;   save(KEYS.ledger,   ledger);   }
      if (data.etf)      { etfLog   = data.etf;      save(KEYS.etf,      etfLog);   }
      if (data.goals)    { goals    = data.goals;    save(KEYS.goals,    goals);    }
      alert('匯入成功！');
      renderPage5();
    } catch {
      alert('檔案格式錯誤，請選擇正確的備份 JSON 檔案。');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('確定要清除所有資料？此操作無法復原。')) return;
  if (!confirm('再次確認：所有帳戶、記帳、投資紀錄都會刪除。')) return;
  Object.values(KEYS).forEach(k => localStorage.removeItem(k));
  localStorage.removeItem('fp_last_backup');
  location.reload();
}

// ── 帳戶 CRUD ──
let editingAccId = null;
let newAccType = 'asset';

function setAccType(type) {
  newAccType = type;
  $('type-asset-btn').classList.toggle('active', type === 'asset');
  $('type-debt-btn').classList.toggle('active', type === 'debt');
}

function openAccountModal(id) {
  editingAccId = id;
  const acc = accounts.find(a => a.id === id);
  $('modal-account-title').textContent = '編輯帳戶';
  $('acc-name').value = acc.name;
  $('acc-value').value = Math.abs(acc.value);
  setAccType(acc.value >= 0 ? 'asset' : 'debt');
  $('acc-exclude').checked = !!acc.exclude;
  $('acc-delete-btn').style.display = '';
  openModal('modal-account');
  setTimeout(() => $('acc-value').focus(), 50);
}

function openAddAccountModal(type) {
  editingAccId = null;
  $('modal-account-title').textContent = '新增帳戶';
  $('acc-name').value = '';
  $('acc-value').value = '';
  $('acc-exclude').checked = false;
  setAccType(type);
  $('acc-delete-btn').style.display = 'none';
  openModal('modal-account');
  setTimeout(() => $('acc-name').focus(), 50);
}

function saveAccount() {
  const name = $('acc-name').value.trim();
  const absVal = parseFloat($('acc-value').value) || 0;
  const value = newAccType === 'debt' ? -absVal : absVal;
  const exclude = $('acc-exclude').checked;
  if (!name) return;
  if (editingAccId) {
    const idx = accounts.findIndex(a => a.id === editingAccId);
    if (idx >= 0) accounts[idx] = { ...accounts[idx], name, value, exclude };
  } else {
    accounts.push({ id: genId(), name, value, exclude });
  }
  save(KEYS.accounts, accounts);
  closeModal('modal-account');
  renderPage1();
}

function deleteAccount() {
  if (!editingAccId) return;
  if (!confirm(`確定刪除「${accounts.find(a=>a.id===editingAccId)?.name}」？`)) return;
  accounts = accounts.filter(a => a.id !== editingAccId);
  save(KEYS.accounts, accounts);
  closeModal('modal-account');
  renderPage1();
}

  save(KEYS.assets, assets);

function calcEtfStats() {
  // 各檔累計投入（含賣出負數）
  const holdingMap = {};
  etfLog.forEach(r => {
    holdingMap[r.name] = (holdingMap[r.name] || 0) + r.amount;
  });
  const totalCost = Object.values(holdingMap).reduce((s, v) => s + v, 0);
  const gain = assets.etfValue - totalCost;
  const returnPct = totalCost > 0 ? ((gain / totalCost) * 100).toFixed(2) : '0.00';
  return { holdingMap, totalCost, gain, returnPct };
}

function openEditLedger(year, month) {

  const r = ledger.find(x => x.year === year && x.month === month);

function deleteLedger() {
  const year  = parseInt($('ledger-year').value);
  const month = parseInt($('ledger-month').selectedIndex) + 1;
  if (!confirm(`確定刪除 ${year} 年 ${month} 月的記錄？`)) return;
  ledger = ledger.filter(r => !(r.year === year && r.month === month));
  save(KEYS.ledger, ledger);
  closeModal('modal-ledger');
  renderPage2();
}

function saveLedger() {
  const year  = parseInt($('ledger-year').value);
  const month = parseInt($('ledger-month').selectedIndex) + 1;
  const income  = parseFloat($('ledger-income').value)  || 0;
  const expense = parseFloat($('ledger-expense').value) || 0;
  const note    = $('ledger-note').value.trim();

  // Upsert: replace if same year+month exists
  const idx = ledger.findIndex(r => r.year === year && r.month === month);
  if (idx >= 0) ledger[idx] = { year, month, income, expense, note };
  else ledger.push({ year, month, income, expense, note });

  save(KEYS.ledger, ledger);
  closeModal('modal-ledger');
  renderPage2();
}

function saveEtf() {
  const date   = $('etf-date').value;
  const name   = $('etf-name').value.trim().toUpperCase();
  const amount = parseFloat($('etf-amount').value) || 0;
  const price  = parseFloat($('etf-price').value)  || 0;
  const note   = $('etf-note').value.trim();
  if (!date || !name || !amount) return;
  etfLog.push({ date, name, amount, price, note });
  save(KEYS.etf, etfLog);
  closeModal('modal-etf');
  renderPage3();
}

  let startY = 0, lastY = 0, dragging = false;

  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0) return;   // 內容還沒滑到頂時不觸發
    startY = e.touches[0].clientY;
    lastY  = startY;
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchmove', e => {
    if (!dragging) return;
    lastY = e.touches[0].clientY;
    const dy = lastY - startY;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });

  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    const dy = lastY - startY;
    sheet.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)';
    if (dy > 100) {
      sheet.style.transform = 'translateY(110%)';
      setTimeout(() => {
        overlay.classList.remove('open');
        sheet.style.transform = '';
        sheet.style.transition = '';
      }, 300);
    } else {
      sheet.style.transform = '';
    }
  });
});

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
initLedgerModal();
$('etf-date').value = new Date().toISOString().slice(0,10);
showPage(0);

// ── Service Worker 註冊 ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/money/sw.js').then(reg => {
      // 新版 SW 安裝完成後，自動重新整理頁面
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'activated') window.location.reload();
        });
      });
    }).catch(err => {
      console.warn('SW 註冊失敗:', err);
    });
  });

  // 新 SW 接管頁面時（skipWaiting 後），重新整理
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    window.location.reload();
  });
}
</script>
