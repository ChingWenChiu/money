<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFBCA6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="財務規劃" />
  <title>財務規劃</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #fff8f5;
      color: #2a1a14;
      overflow: hidden;
    }

    /* ── App Shell ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: #fff8f5;
    }

    /* ── Scrollable Content Area ── */
    #content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: env(safe-area-inset-top, 44px) 16px 16px;
    }

    /* ── Bottom Nav ── */
    #nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
      background: #fff8f5;
      border-top: 0.5px solid rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 16px;
      border: none;
      background: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item svg { display: block; }
    .nav-label {
      font-size: 10px;
      font-weight: 500;
      color: #d4b0a4;
    }
    .nav-item.active .nav-label { color: #c4614a; }

    /* ── Page Header ── */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .page-title { font-size: 26px; font-weight: 700; color: #2a1a14; }
    .page-sub { font-size: 12px; color: #c4a89a; margin-top: 2px; }
    .edit-btn {
      width: 32px; height: 32px;
      background: #ffe8e0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    /* ── Hero Card ── */
    .hero-card {
      background: #FFBCA6;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .hero-label { font-size: 11px; color: rgba(80,30,15,0.6); margin-bottom: 3px; }
    .hero-amount { font-size: 32px; font-weight: 700; color: #3d1a0a; letter-spacing: -1px; }
    .hero-sub { font-size: 11px; color: rgba(80,30,15,0.5); margin-top: 3px; }
    .hero-track {
      background: rgba(255,255,255,0.35);
      border-radius: 5px; height: 6px;
      margin-top: 12px; overflow: hidden;
    }
    .hero-fill { height: 100%; border-radius: 5px; background: #fff0ea; transition: width 0.5s ease; }
    .hero-footer {
      display: flex; justify-content: space-between;
      margin-top: 6px; font-size: 10px;
      color: rgba(80,30,15,0.55);
    }

    /* ── Section Label ── */
    .sec-label {
      font-size: 11px; font-weight: 600;
      color: #c4a89a; letter-spacing: 0.06em;
      margin-bottom: 8px; margin-top: 4px;
    }

    /* ── Asset Grid (Page 1) ── */
    .asset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .asset-item {
      background: #fff;
      border-radius: 14px;
      padding: 11px 13px;
      border: 0.5px solid rgba(0,0,0,0.05);
    }
    .asset-item.full { grid-column: span 2; }
    .asset-name { font-size: 11px; color: #c4a89a; margin-bottom: 4px; }
    .asset-val { font-size: 17px; font-weight: 700; color: #2a1a14; }
    .asset-val.accent { color: #c4614a; }
    .asset-val.warn { color: #c48a3a; }
    .asset-val.neg { color: #d05a3a; }
    .asset-sub { font-size: 10px; color: #d4b8ae; margin-top: 2px; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      border: 0.5px solid rgba(0,0,0,0.05);
      margin-bottom: 12px;
    }

    /* ── Entry Row ── */
    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 0.5px solid rgba(0,0,0,0.05);
    }
    .entry-row:last-child { border-bottom: none; }
    .entry-left { display: flex; align-items: flex-start; gap: 9px; }
    .entry-dot {
      width: 8px; height: 8px;
      border-radius: 50%; flex-shrink: 0;
      margin-top: 3px;
    }
    .entry-name { font-size: 13px; font-weight: 500; color: #2a1a14; }
    .entry-sub { font-size: 10px; color: #c4a89a; }
    .entry-note {
      display: inline-flex; align-items: center; gap: 4px;
      background: #fff8f0; border-radius: 6px;
      padding: 3px 7px; margin-top: 4px;
      font-size: 10px; color: #c48a3a;
    }
    .entry-note-dot { width: 5px; height: 5px; border-radius: 50%; background: #FFBCA6; flex-shrink: 0; }
    .entry-right { text-align: right; }
    .entry-amount { font-size: 14px; font-weight: 700; }
    .entry-amount.pos { color: #4a9e72; }
    .entry-amount.neg { color: #d05a3a; }
    .entry-amount.accent { color: #c4614a; }
    .entry-detail { font-size: 10px; color: #c4a89a; }

    /* ── Add Button ── */
    .add-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 7px;
      background: #ffe8e0;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      border: none; cursor: pointer;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .add-btn span { font-size: 13px; font-weight: 600; color: #c4614a; }
    .add-circle {
      width: 18px; height: 18px;
      background: #FFBCA6;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #7a2a18; font-size: 16px; font-weight: 700; line-height: 1;
    }

    /* ── Year Tabs ── */
    .tab-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab-btn {
      padding: 5px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      background: #f5ede8; color: #c4a89a;
      border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { background: #FFBCA6; color: #7a2a18; }

    /* ── Mini Bar Chart ── */
    .mini-bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 56px;
      margin-bottom: 6px;
    }
    .mini-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      height: 100%;
      justify-content: flex-end;
    }
    .mini-bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      min-height: 3px;
    }
    .mini-bar-lbl { font-size: 8px; color: #c4a89a; }

    /* ── ETF Hero ── */
    .etf-hero {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .etf-main { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
    .etf-lbl { font-size: 11px; color: #c4a89a; margin-bottom: 6px; }
    .etf-big { font-size: 30px; font-weight: 700; color: #2a1a14; letter-spacing: -1px; }
    .etf-ret { font-size: 15px; font-weight: 700; color: #d05a3a; }
    .etf-cost-row { display: flex; gap: 20px; margin-top: 8px; }
    .etf-cost-lbl { font-size: 10px; color: #c4a89a; margin-bottom: 2px; }
    .etf-cost-val { font-size: 13px; font-weight: 600; color: #6a3a2a; }
    .etf-gain-val { font-size: 13px; font-weight: 700; color: #d05a3a; }
    .seg-bar {
      height: 8px; border-radius: 6px;
      display: flex; gap: 3px;
      margin-top: 12px; overflow: hidden;
    }
    .seg-tw { flex: 65.41; background: #6baed6; }
    .seg-os { flex: 34.59; background: #74c69d; }
    .seg-labels { display: flex; gap: 14px; margin-top: 6px; }
    .seg-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #6a3a2a; font-weight: 500; }
    .seg-sq { width: 9px; height: 9px; border-radius: 2px; }

    /* ── Goal Items (Page 4) ── */
    .goal-item {
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      border: 0.5px solid rgba(0,0,0,0.05);
      margin-bottom: 9px;
    }
    .goal-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .goal-name { font-size: 13px; font-weight: 600; color: #2a1a14; }
    .goal-pct { font-size: 11px; font-weight: 700; color: #c4614a; }
    .goal-pct.done { color: #4a9e72; }
    .goal-track { background: #f5ede8; border-radius: 5px; height: 7px; overflow: hidden; }
    .goal-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
    .goal-detail { font-size: 10px; color: #c4a89a; margin-top: 5px; }

    /* ── Modal Overlay ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(40,20,10,0.45);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: #fff8f5;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: #d4b0a4; border-radius: 2px;
      margin: 0 auto 16px;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: #2a1a14; margin-bottom: 16px; }

    /* ── Form Fields ── */
    .field { margin-bottom: 14px; }
    .field label { font-size: 11px; color: #c4a89a; font-weight: 600; display: block; margin-bottom: 5px; }
    .field input, .field textarea, .field select {
      width: 100%;
      background: #f5ede8;
      border: 0.5px solid rgba(0,0,0,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: #2a1a14;
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: #FFBCA6;
    }
    .field textarea { resize: none; height: 72px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .submit-btn {
      width: 100%;
      background: #FFBCA6;
      color: #7a2a18;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px;
    }
    .cancel-btn {
      width: 100%;
      background: #f5ede8;
      color: #c4a89a;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-item active" onclick="showPage(0)" id="nav0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="12" width="7" height="9" rx="1.5" fill="#c4614a"/>
        <rect x="13" y="5" width="8" height="16" rx="1.5" fill="#c4614a" opacity="0.45"/>
      </svg>
      <span class="nav-label">總覽</span>
    </button>
    <button class="nav-item" onclick="showPage(1)" id="nav1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="8" stroke="#d4b0a4" stroke-width="1.6"/>
        <path d="M12 7v5l3.5 2" stroke="#d4b0a4" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">記帳</span>
    </button>
    <button class="nav-item" onclick="showPage(2)" id="nav2">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 17l5-6 5 4 6-8" stroke="#d4b0a4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">投資</span>
    </button>
    <button class="nav-item" onclick="showPage(3)" id="nav3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 15.5l-5 2.7 1-5.5L4 8.8 9.5 8z" stroke="#d4b0a4" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">目標</span>
    </button>
  </nav>
</div>

<!-- ── Modal: 新增月份記帳 ── -->
<div class="modal-overlay" id="modal-ledger">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">新增月份記錄</div>
    <div class="field-row">
      <div class="field">
        <label>年份</label>
        <select id="ledger-year"></select>
      </div>
      <div class="field">
        <label>月份</label>
        <select id="ledger-month">
          <option>1月</option><option>2月</option><option>3月</option>
          <option>4月</option><option>5月</option><option>6月</option>
          <option>7月</option><option>8月</option><option>9月</option>
          <option>10月</option><option>11月</option><option>12月</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>收入 (TWD)</label><input type="number" id="ledger-income" placeholder="0" /></div>
      <div class="field"><label>支出 (TWD)</label><input type="number" id="ledger-expense" placeholder="0" /></div>
    </div>
    <div class="field">
      <label>備註（可選）</label>
      <textarea id="ledger-note" placeholder="例如：出國玩、紅包、健檢…"></textarea>
    </div>
    <button class="submit-btn" onclick="saveLedger()">儲存</button>
    <button class="cancel-btn" onclick="closeModal('modal-ledger')">取消</button>
  </div>
</div>

<!-- ── Modal: 新增 ETF 投資 ── -->
<div class="modal-overlay" id="modal-etf">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">新增投資筆數</div>
    <div class="field-row">
      <div class="field">
        <label>日期</label>
        <input type="date" id="etf-date" />
      </div>
      <div class="field">
        <label>ETF 名稱</label>
        <input type="text" id="etf-name" placeholder="例如 QQQ" />
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>投資金額 (TWD)</label><input type="number" id="etf-amount" placeholder="0" /></div>
      <div class="field"><label>成交價</label><input type="number" id="etf-price" placeholder="0.00" step="0.01" /></div>
    </div>
    <div class="field">
      <label>備註（可選）</label>
      <input type="text" id="etf-note" placeholder="可選" />
    </div>
    <button class="submit-btn" onclick="saveEtf()">儲存</button>
    <button class="cancel-btn" onclick="closeModal('modal-etf')">取消</button>
  </div>
</div>

<!-- ── Modal: 編輯資產快照 ── -->
<div class="modal-overlay" id="modal-assets">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">更新資產快照</div>
    <div class="field"><label>台新銀行</label><input type="number" id="a-taishin" /></div>
    <div class="field"><label>國泰銀行</label><input type="number" id="a-cathay" /></div>
    <div class="field"><label>ETF 庫存總現值</label><input type="number" id="a-etf" /></div>
    <div class="field"><label>媽媽借款</label><input type="number" id="a-mom" /></div>
    <div class="field"><label>信用卡帳單（負數）</label><input type="number" id="a-cc" /></div>
    <button class="submit-btn" onclick="saveAssets()">儲存</button>
    <button class="cancel-btn" onclick="closeModal('modal-assets')">取消</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  DATA STORE  (localStorage)
// ═══════════════════════════════════════
const KEYS = {
  assets: 'fp_assets',
  ledger: 'fp_ledger',
  etf: 'fp_etf',
  goals: 'fp_goals',
};

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; }
}
function save(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

// ── Default Data (your real numbers) ──
const defaultAssets = {
  taishin: 150000,
  cathay: 55000,
  etfValue: 211067,
  etfReturn: 19.10,
  etfCost: 177214,
  etfGain: 33853,
  mom: 66915,
  creditCard: -71972,
};

const defaultLedger = [
  // 2025
  { year: 2025, month: 1,  income: 72565, expense: 47005, note: '紅包 + 孝親費' },
  { year: 2025, month: 2,  income: 39800, expense: 29043, note: '' },
  { year: 2025, month: 3,  income: 40400, expense: 40418, note: '' },
  { year: 2025, month: 4,  income: 51300, expense: 28339, note: '' },
  { year: 2025, month: 5,  income: 57200, expense: 37339, note: '' },
  { year: 2025, month: 6,  income: 53500, expense: 38998, note: '台南、健檢' },
  { year: 2025, month: 7,  income: 43300, expense: 35469, note: '改造家' },
  { year: 2025, month: 8,  income: 44500, expense: 29924, note: '' },
  { year: 2025, month: 9,  income: 42000, expense: 39657, note: '香港旅遊 $15,000' },
  { year: 2025, month: 10, income: 45650, expense: 32293, note: '' },
  { year: 2025, month: 11, income: 62180, expense: 76010, note: '普發 $10,000，出國 $46,000' },
  { year: 2025, month: 12, income: 40000, expense: 38357, note: '珍珠、燙髮' },
  // 2026
  { year: 2026, month: 1,  income: 48000, expense: 38800, note: '' },
  { year: 2026, month: 2,  income: 46000, expense: 37600, note: '過年·紅包' },
  { year: 2026, month: 3,  income: 52000, expense: 39600, note: '' },
];

const defaultEtf = [
  { date: '2026-01-15', name: '006208', amount: 5933,  price: 160.34, note: '' },
  { date: '2026-01-15', name: 'QQQ',    amount: 2847,  price: 626.71, note: '' },
  { date: '2026-01-15', name: 'IBB',    amount: 951,   price: 172.49, note: '' },
  { date: '2026-02-17', name: 'QQQ',    amount: 2841,  price: 598.29, note: '' },
  { date: '2026-02-17', name: 'IBB',    amount: 949,   price: 172.49, note: '' },
  { date: '2026-02-23', name: '006208', amount: 5942,  price: 180.05, note: '' },
  { date: '2026-03-10', name: '006208', amount: 5952,  price: 175.04, note: '' },
  { date: '2026-03-16', name: 'QQQ',    amount: 2878,  price: 599.96, note: '' },
  { date: '2026-03-16', name: 'IBB',    amount: 962,   price: 166.39, note: '' },
];

const defaultGoals = {
  house: 3000000,
  milestones: [
    { age: 25, year: 2025, target: 380000 },
    { age: 26, year: 2026, target: 700000 },
    { age: 27, year: 2027, target: 1150000 },
    { age: 28, year: 2028, target: 1650000 },
    { age: 29, year: 2029, target: 2200000 },
    { age: 30, year: 2030, target: 2800000 },
  ]
};

// Load or init
let assets  = load(KEYS.assets, defaultAssets);
let ledger  = load(KEYS.ledger, defaultLedger);
let etfLog  = load(KEYS.etf,    defaultEtf);
let goals   = load(KEYS.goals,  defaultGoals);

// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('zh-TW');
const fmtSigned = n => (n >= 0 ? '+$' : '-$') + Math.abs(Math.round(n)).toLocaleString('zh-TW');

function netWorth() {
  return assets.taishin + assets.cathay + assets.etfValue + assets.mom + assets.creditCard;
}

function ledgerByYear(year) {
  return ledger.filter(r => r.year === year).sort((a,b) => b.month - a.month);
}

function recentSixMonths() {
  const sorted = [...ledger].sort((a,b) => a.year !== b.year ? b.year - a.year : b.month - a.month);
  return sorted.slice(0, 6).reverse();
}

function etfTotals() {
  const map = {};
  etfLog.forEach(r => {
    if (!map[r.name]) map[r.name] = { amount: 0, count: 0 };
    map[r.name].amount += r.amount;
    map[r.name].count += 1;
  });
  return map;
}

function etfYearTotal(year) {
  return etfLog.filter(r => r.date.startsWith(year)).reduce((s,r) => s + r.amount, 0);
}

// ═══════════════════════════════════════
//  PAGE RENDERING
// ═══════════════════════════════════════
let currentPage = 0;
let currentLedgerYear = 2026;

function showPage(idx) {
  currentPage = idx;
  document.querySelectorAll('.nav-item').forEach((b,i) => b.classList.toggle('active', i === idx));
  // update nav icon colors
  const icons = ['nav0','nav1','nav2','nav3'];
  icons.forEach((id, i) => {
    const btn = $(id);
    btn.querySelectorAll('path,rect,circle').forEach(el => {
      const isActive = i === idx;
      if (el.getAttribute('fill') && el.getAttribute('fill') !== 'none') {
        el.setAttribute('fill', isActive ? '#c4614a' : '#d4b0a4');
        if (el.getAttribute('opacity')) el.setAttribute('opacity', isActive ? '0.45' : '0.45');
      }
      if (el.getAttribute('stroke') && el.getAttribute('stroke') !== 'none') {
        el.setAttribute('stroke', isActive ? '#c4614a' : '#d4b0a4');
      }
    });
  });
  const pages = [renderPage1, renderPage2, renderPage3, renderPage4];
  $('content').innerHTML = '';
  pages[idx]();
}

// ── Page 1: 總覽 ──

  const nw = netWorth();

  const yearEst = 2031; // TODO: calculate dynamically

      </div>
      <button class="edit-btn" onclick="openAssetsModal()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M11 2l3 3-9 9H2v-3L11 2z" stroke="#c4614a" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="hero-card">
      <div class="hero-label">買房頭期款目標</div>
      <div class="hero-amount">$${fmt(nw)}</div>
      <div class="hero-sub">目標 $${fmt(houseGoal)} · 剩餘 $${fmt(houseGoal - nw)}</div>
      <div class="hero-track"><div class="hero-fill" style="width:${pct}%"></div></div>
      <div class="hero-footer"><span>${pct}% 達成</span><span>預估 ${yearEst} 年</span></div>
    </div>

    <div class="sec-label">資產帳戶</div>
    <div class="asset-grid">
      <div class="asset-item">
        <div class="asset-name">台新銀行</div>
        <div class="asset-val">$${fmt(assets.taishin)}</div>
      </div>
      <div class="asset-item">
        <div class="asset-name">國泰銀行</div>
        <div class="asset-val">$${fmt(assets.cathay)}</div>
      </div>
      <div class="asset-item">
        <div class="asset-name">ETF 市值</div>
        <div class="asset-val accent">$${fmt(assets.etfValue)}</div>
        <div class="asset-sub">+${assets.etfReturn}%</div>
      </div>
      <div class="asset-item">
        <div class="asset-name">媽媽借款</div>
        <div class="asset-val warn">$${fmt(assets.mom)}</div>
      </div>
    </div>

    <div class="sec-label">負債</div>
    <div class="asset-grid">
      <div class="asset-item full">
        <div class="asset-name">信用卡帳單</div>
        <div class="asset-val neg">-$${fmt(Math.abs(assets.creditCard))}</div>
        <div class="asset-sub">台新 · 國泰 · 富邦</div>
      </div>
    </div>
  `;
}

// ── Page 2: 記帳 ──
function renderPage2() {
  const recent = recentSixMonths();
  const maxSavings = Math.max(...recent.map(r => Math.abs(r.income - r.expense)), 1);
  const bars = recent.map(r => {
    const s = r.income - r.expense;
    const h = Math.max(Math.round((Math.abs(s) / maxSavings) * 100), 4);
    const color = s >= 0 ? (h > 70 ? '#c4614a' : '#FFBCA6') : '#f5a898';
    return `<div class="mini-bar-col">
      <div class="mini-bar" style="height:${h}%;background:${color};"></div>
      <div class="mini-bar-lbl">${r.month}月</div>
    </div>`;
  }).join('');

  const rows = ledgerByYear(currentLedgerYear).map(r => {
    const s = r.income - r.expense;
    const cls = s >= 0 ? 'pos' : 'neg';
    const dot = s >= 0 ? (r.note ? '#c48a3a' : '#4a9e72') : '#d05a3a';
    const noteHtml = r.note ? `<div class="entry-note"><div class="entry-note-dot"></div>${r.note}</div>` : '';
    return `<div class="entry-row">
      <div class="entry-left">
        <div class="entry-dot" style="background:${dot};"></div>
        <div>
          <div class="entry-name">${r.month}月</div>
          ${noteHtml}
        </div>
      </div>
      <div class="entry-right">
        <div class="entry-amount ${cls}">${fmtSigned(s)}</div>
        <div class="entry-detail">收 $${fmt(r.income)} / 支 $${fmt(r.expense)}</div>
      </div>
    </div>`;
  }).join('');

  const yearBtns = [2026, 2025, 2024].map(y =>
    `<button class="tab-btn ${y === currentLedgerYear ? 'active' : ''}" onclick="switchLedgerYear(${y})">${y}</button>`
  ).join('');

  $('content').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">記帳</div>
        <div class="page-sub">月收支記錄</div>
      </div>
    </div>

    <div class="tab-row">${yearBtns}</div>

    <div class="sec-label">近 6 個月存款趨勢</div>
    <div class="card">
      <div class="mini-bars">${bars}</div>
    </div>

    <button class="add-btn" onclick="openModal('modal-ledger')">
      <div class="add-circle">+</div>
      <span>新增本月紀錄</span>
    </button>

    <div class="card">${rows || '<div style="padding:8px 0;font-size:13px;color:#c4a89a;text-align:center;">尚無資料</div>'}</div>
  `;
}

function switchLedgerYear(y) {
  currentLedgerYear = y;
  renderPage2();
}

// ── Page 3: 投資 ──
function renderPage3() {
  const totals = etfTotals();
  const etfNames = Object.keys(totals);
  const colors = { '006208': '#6baed6', 'QQQ': '#74c69d', 'IBB': '#74c69d' };
  const textColors = { '006208': '#1a4a7a', 'QQQ': '#1a5a3a', 'IBB': '#2a6a4a' };

  const etfRows = etfNames.map(name => {
    const d = totals[name];
    const col = colors[name] || '#c4614a';
    const tcol = textColors[name] || '#5a2a1a';
    return `<div class="entry-row">
      <div class="entry-left">
        <div class="entry-dot" style="background:${col};"></div>
        <div>
          <div class="entry-name">${name}</div>
          <div class="entry-sub">${d.count} 筆 · 至今累計</div>
        </div>
      </div>
      <div class="entry-right">
        <div class="entry-amount" style="color:${tcol};">$${fmt(d.amount)}</div>
      </div>
    </div>`;
  }).join('');

  const years = [...new Set(etfLog.map(r => r.date.slice(0,4)))].sort((a,b) => b-a);
  const yearRows = years.map(y => {
    const total = etfYearTotal(y);
    const isLatest = y === years[0];
    return `<div class="entry-row">
      <div class="entry-left">
        <div class="entry-dot" style="background:${isLatest ? '#FFBCA6' : '#c4614a'};"></div>
        <div>
          <div class="entry-name">${y}年</div>
        </div>
      </div>
      <div class="entry-right">
        <div class="entry-amount" style="color:${isLatest ? '#c48a3a' : '#c4614a'};">$${fmt(total)}</div>
      </div>
    </div>`;
  }).join('');

  $('content').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">投資紀錄</div>
        <div class="page-sub">定期定額</div>
      </div>
    </div>

    <div class="etf-hero">
      <div class="etf-lbl">庫存總現值 (TWD)</div>
      <div class="etf-main">
        <div class="etf-big">${fmt(assets.etfValue)}</div>
        <div class="etf-ret">(+${assets.etfReturn}%)</div>
      </div>
      <div class="etf-cost-row">
        <div>
          <div class="etf-cost-lbl">總成本</div>
          <div class="etf-cost-val">${fmt(assets.etfCost)}</div>
        </div>
        <div>
          <div class="etf-cost-lbl">不含息參考報酬</div>
          <div class="etf-gain-val">+${fmt(assets.etfGain)}</div>
        </div>
      </div>
      <div class="seg-bar">
        <div class="seg-tw"></div>
        <div class="seg-os"></div>
      </div>
      <div class="seg-labels">
        <div class="seg-item"><div class="seg-sq" style="background:#6baed6;"></div>台股 65.41%</div>
        <div class="seg-item"><div class="seg-sq" style="background:#74c69d;"></div>海外股 34.59%</div>
      </div>
    </div>

    <div class="sec-label">各檔投入總額</div>
    <div class="card">${etfRows}</div>

    <button class="add-btn" onclick="openModal('modal-etf')">
      <div class="add-circle">+</div>
      <span>新增投資筆數</span>
    </button>

    <div class="sec-label">年度投入</div>
    <div class="card">${yearRows}</div>
  `;
}

// ── Page 4: 目標 ──
function renderPage4() {
  const nw = netWorth();
  const houseGoal = goals.house;
  const pct = Math.min((nw / houseGoal) * 100, 100).toFixed(1);

  const milestoneRows = goals.milestones.map(m => {
    const p = Math.min((nw / m.target) * 100, 100).toFixed(0);
    const done = nw >= m.target;
    const fillColor = done ? '#4a9e72' : (p > 50 ? '#FFBCA6' : '#ffd4c4');
    const pctLabel = done
      ? '<span class="goal-pct done">✓ 達標</span>'
      : `<span class="goal-pct">${p}%</span>`;
    const detail = done
      ? `$${fmt(nw)} / $${fmt(m.target)} · 超標 $${fmt(nw - m.target)}`
      : `$${fmt(nw)} / $${fmt(m.target)} · 還需 $${fmt(m.target - nw)}`;
    return `<div class="goal-item">
      <div class="goal-row">
        <div class="goal-name">${m.age}歲 · ${m.year}</div>
        ${pctLabel}
      </div>
      <div class="goal-track"><div class="goal-fill" style="width:${p}%;background:${fillColor};"></div></div>
      <div class="goal-detail">${detail}</div>
    </div>`;
  }).join('');

  $('content').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">目標追蹤</div>
        <div class="page-sub">30歲資產計畫</div>
      </div>
    </div>

    <div class="hero-card">
      <div class="hero-label">買房頭期款</div>
      <div class="hero-amount">$${fmt(houseGoal)}</div>
      <div class="hero-sub">目前 $${fmt(nw)} · 達成 ${pct}%</div>
      <div class="hero-track"><div class="hero-fill" style="width:${pct}%"></div></div>
      <div class="hero-footer"><span>預估達標：2031年</span><span>還需 $${fmt(houseGoal - nw)}</span></div>
    </div>

    <div class="sec-label">30 歲分年里程碑</div>
    ${milestoneRows}
  `;
}

// ═══════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════
function openModal(id) {
  $(id).classList.add('open');
}
function closeModal(id) {
  $(id).classList.remove('open');
}

function openAssetsModal() {
  $('a-taishin').value = assets.taishin;
  $('a-cathay').value = assets.cathay;
  $('a-etf').value = assets.etfValue;
  $('a-mom').value = assets.mom;
  $('a-cc').value = assets.creditCard;
  openModal('modal-assets');
}

function saveAssets() {
  assets.taishin   = parseFloat($('a-taishin').value) || 0;
  assets.cathay    = parseFloat($('a-cathay').value)  || 0;
  assets.etfValue  = parseFloat($('a-etf').value)     || 0;
  assets.mom       = parseFloat($('a-mom').value)     || 0;
  assets.creditCard= parseFloat($('a-cc').value)      || 0;
  save(KEYS.assets, assets);
  closeModal('modal-assets');
  showPage(currentPage);
}

// Init year select for ledger modal
function initLedgerModal() {
  const sel = $('ledger-year');
  sel.innerHTML = '';
  [2026, 2025, 2024].forEach(y => {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + '年';
    sel.appendChild(o);
  });
}

function saveLedger() {
  const year  = parseInt($('ledger-year').value);
  const month = parseInt($('ledger-month').selectedIndex) + 1;
  const income  = parseFloat($('ledger-income').value)  || 0;
  const expense = parseFloat($('ledger-expense').value) || 0;
  const note    = $('ledger-note').value.trim();

  // Upsert: replace if same year+month exists
  const idx = ledger.findIndex(r => r.year === year && r.month === month);
  if (idx >= 0) ledger[idx] = { year, month, income, expense, note };
  else ledger.push({ year, month, income, expense, note });

  save(KEYS.ledger, ledger);
  closeModal('modal-ledger');
  renderPage2();
}

function saveEtf() {
  const date   = $('etf-date').value;
  const name   = $('etf-name').value.trim().toUpperCase();
  const amount = parseFloat($('etf-amount').value) || 0;
  const price  = parseFloat($('etf-price').value)  || 0;
  const note   = $('etf-note').value.trim();
  if (!date || !name || !amount) return;
  etfLog.push({ date, name, amount, price, note });
  save(KEYS.etf, etfLog);
  closeModal('modal-etf');
  renderPage3();
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) el.classList.remove('open');
  });
});

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
initLedgerModal();
$('etf-date').value = new Date().toISOString().slice(0,10);
showPage(0);

// ── Service Worker 註冊 ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/財務規劃app/money/sw.js').catch(err => {
      console.warn('SW 註冊失敗:', err);
    });
  });
}
</script>
